name: Build Sakina Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3
          npm install -D @capacitor/cli@7.4.3 @capacitor/assets@3.0.5

      - name: Create web folder
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d scripts ]; then
            cp -r scripts www/
          fi

      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "سَكينة - تحفيظ القرآن الكريم",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      # ==========================================
      # NEW APP ICON
      # ==========================================

      - name: Prepare new app icon
        run: |
          rm -rf resources
          mkdir -p resources

          cp assets/imgs/app_icon.png resources/icon.png

      - name: Generate Android app icons
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

      # ==========================================
      # APP NAME
      # ==========================================

      - name: Set app name
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">سَكينة - تحفيظ القرآن الكريم</string>#' \
          android/app/src/main/res/values/strings.xml

      # ==========================================
      # BUILD
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clean Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakina-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
