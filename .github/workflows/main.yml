name: Build Sakina Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "سَكينة - تحفيظ القرآن الكريم",
            "webDir": "."
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Copy website
        run: npx cap copy android

      - name: Set app name
        run: |
          sed -i 's/app_name">.*</app_name>/app_name">سَكينة - تحفيظ القرآن الكريم</app_name>/' android/app/src/main/res/values/strings.xml

      - name: Set app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/imgs/app_icon.png android/app/src/main/res/drawable/app_icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"',
                        'android:icon="@drawable/app_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"',
                        'android:roundIcon="@drawable/app_icon"')
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakina-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
