name: Build Sakina Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Create web folder
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r assets www/
          cp -r scripts www/ || true

      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "سَكينة - تحفيظ القرآن الكريم",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android --no-sync

      - name: Sync Android
        run: npx cap sync android

      - name: Set app name
        run: |
          sed -i 's/app_name">.*</app_name>/app_name">سَكينة - تحفيظ القرآن الكريم</app_name>/' android/app/src/main/res/values/strings.xml || true

      - name: Set app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/imgs/app_icon.png android/app/src/main/res/drawable/app_icon.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakina-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
