name: Build Sakina Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package
        run: |
          npm init -y
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3
          npm install -D @capacitor/cli@7.4.3

      - name: Create web folder
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d scripts ]; then
            cp -r scripts www/
          fi

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "سَكينة - تحفيظ القرآن الكريم",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      # ===============================
      # CREATE NEW ICON
      # ===============================

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Replace Android launcher icon
        run: |
          ICON="assets/imgs/app_icon.png"

          test -f "$ICON"

          RES="android/app/src/main/res"

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable/ic_launcher*
          rm -rf "$RES"/drawable-v24/ic_launcher*

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          magick "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          magick "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          magick "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          magick "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          magick "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      # ===============================
      # FORCE ANDROID TO USE THE ICON
      # ===============================

      - name: Force launcher icon in Manifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          if 'android:roundIcon=' in text:
              import re
              text = re.sub(
                  r'\s+android:roundIcon="[^"]*"',
                  ' android:roundIcon="@mipmap/ic_launcher_round"',
                  text
              )
          else:
              text = text.replace(
                  '<application ',
                  '<application android:roundIcon="@mipmap/ic_launcher_round" ',
                  1
              )

          p.write_text(text)
          PY

      # ===============================
      # APP NAME
      # ===============================

      - name: Set app name
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")
          text = p.read_text()

          text = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">سَكينة - تحفيظ القرآن الكريم</string>',
              text,
              flags=re.DOTALL
          )

          p.write_text(text)
          PY

      # ===============================
      # KOTLIN FIX
      # ===============================

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

      # ===============================
      # JAVA
      # ===============================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ===============================
      # BUILD
      # ===============================

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      # ===============================
      # UPLOAD
      # ===============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakina-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
