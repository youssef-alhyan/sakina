name: Build Sakina Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create package.json
        run: |
          npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "سَكينة - تحفيظ القرآن الكريم",
            "webDir": "."
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android

      - name: Copy website
        run: |
          npx cap copy android

      - name: Set application name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text()

          import re
          s = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">سَكينة - تحفيظ القرآن الكريم</string>',
              s
          )

          p.write_text(s)
          PY

      - name: Set application icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/imgs/app_icon.png android/app/src/main/res/drawable/app_icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '@mipmap/ic_launcher',
              '@drawable/app_icon'
          )

          s = s.replace(
              '@mipmap/ic_launcher_round',
              '@drawable/app_icon'
          )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             sakina-quran.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakina-Quran-APK
          path: sakina-quran.apk
