
name: Build Sakina iOS

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Sakina for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install --save-exact \
            @capacitor/core@7.4.3 \
            @capacitor/ios@7.4.3 \
            @capacitor/cli@7.4.3

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

          if [ -d assets ]; then
            cp -R assets www/assets
          fi

          if [ -d scripts ]; then
            cp -R scripts www/scripts
          fi

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sakina.quran",
            "appName": "Sakina",
            "webDir": "www"
          }
          EOF

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/App.app \
            Sakina-iOS-Simulator.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Sakina-iOS-Simulator
          path: Sakina-iOS-Simulator.zip
          if-no-files-found: error
